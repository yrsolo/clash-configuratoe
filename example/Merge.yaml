# Synthetic Clash import example; all endpoints are placeholders.
proxy-providers:
  source_1:
    type: http
    url: https://subscription.invalid/replace-with-your-subscription
    path: ./source_1.yaml
    interval: 3600
    health-check:
      enable: true
      interval: 600
      url: http://www.gstatic.com/generate_204
proxy-groups:
  - name: AI Services
    type: select
    use: [source_1]
    proxies: [DIRECT]
  - name: Telegram
    type: select
    use: [source_1]
    proxies: [DIRECT]
  - name: Rest Of World
    type: select
    use: [source_1]
    proxies: [DIRECT]
rules:
  - DOMAIN-SUFFIX,local,DIRECT
  - IP-CIDR,192.168.0.0/16,DIRECT
  - DOMAIN-SUFFIX,chatgpt.com,AI Services
  - DOMAIN-SUFFIX,telegram.org,Telegram
  - MATCH,Rest Of World
